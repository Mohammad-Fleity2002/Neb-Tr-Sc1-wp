version: 0.0
os: linux

files:
  - source: wordpress-deploy/
    destination: /var/www/html
    overwrite: yes

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root

